# Copy this file into .github/workflows/ of each module repo (all seven have
# their own indexed NoSketch corpus: KIP, KIPasti, ParlaBO, ParlaTO, ParlaBZ,
# Stra-ParlaBO, Stra-ParlaTO — see NOSKETCH_MODULES in
# KIParla-NoSketch-Data/.github/workflows/regenerate-on-release.yml). The
# aggregate KIParla corpus is rebuilt separately, from KIParla-collection (see
# KIParla-collection/.github/workflows/build.yml).
#
# Required secret in each module repo:
#   NOSKETCH_DATA_TOKEN — a GitHub PAT with `repo` scope on
#   KIParla/KIParla-NoSketch-Data
#   (Settings → Secrets and variables → Actions → New repository secret)

name: Notify NoSketch Data on Release

on:
  release:
    types: [published]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch regeneration to KIParla-NoSketch-Data
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.NOSKETCH_DATA_TOKEN }}
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: 'KIParla',
              repo: 'KIParla-NoSketch-Data',
              event_type: 'module-released',
              client_payload: {
                module: context.repo.repo,
                tag: context.ref.replace('refs/tags/', ''),
                release_url: context.payload.release.html_url,
              },
            });
